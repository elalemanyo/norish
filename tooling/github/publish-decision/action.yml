name: "Publish decision"
description: "Whether a pinned image tag is built and pushed, and whether latest moves to it."

inputs:
  image:
    description: "The image without its tag. It holds the Docker Hub username, a secret, so it is never an output."
    required: true
  tag:
    description: "The pinned tag."
    required: true
  pin-file:
    description: "The file the tag is pinned in, named when a manual run refuses a published tag."
    required: true
  allow-overwrite:
    description: "Republish a tag the registry already has, on a manual run."
    required: false
    default: "false"

outputs:
  publish:
    description: "true when the pinned tag is built and pushed."
    value: ${{ steps.plan.outputs.publish }}
  promote:
    description: "true when latest moves to the pinned tag, which only main does."
    value: ${{ steps.plan.outputs.promote }}

runs:
  using: composite
  steps:
    # A push publishes a tag the registry does not have; a manual run refuses one it has unless
    # told to overwrite it. A pull request publishes nothing.
    - name: Decide what to publish
      id: plan
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        PIN_FILE: ${{ inputs.pin-file }}
        ALLOW_OVERWRITE: ${{ inputs.allow-overwrite }}
      run: |
        set -euo pipefail
        publish=false
        promote=false
        if [ "$EVENT" != "pull_request" ]; then
          ref="${IMAGE}:${TAG}"
          if ! docker buildx imagetools inspect --raw "$ref" >/dev/null 2>&1; then
            echo "$ref is unpublished, publishing."
            publish=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$ALLOW_OVERWRITE" = "true" ]; then
            echo "$ref is already published, overwriting as asked."
            publish=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "$ref is already published. Bump its tag in $PIN_FILE," >&2
            echo "or re-run with allow-overwrite if you really mean to replace it." >&2
            exit 1
          else
            echo "$ref is already published, nothing to build."
          fi
          if [ "$REF" = "refs/heads/main" ]; then promote=true; fi
        fi
        echo "publish=$publish" >> "$GITHUB_OUTPUT"
        echo "promote=$promote" >> "$GITHUB_OUTPUT"
